<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>إدارة الأشخاص والأرصدة</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 12px;background:#0b1120;color:#edf3ff;font:14px Tahoma,Arial,sans-serif}.container{width:min(100%,1000px);margin:auto}header{margin-bottom:14px}header h1{margin:0 0 5px;font-size:20px}header p{margin:0;color:#94a7c5;font-size:12px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}.card,.panel{background:#141d30;border:1px solid #293852;border-radius:8px;padding:10px}.summary-label{color:#94a7c5;font-size:12px}.summary-value{margin-top:4px;font-size:18px;font-weight:bold;overflow-wrap:anywhere}.balance-value{color:#34d399}.panel{margin-bottom:10px}.panel h2{margin:0 0 8px;font-size:14px}form{display:grid;grid-template-columns:2fr 1fr auto;align-items:end;gap:6px}.field{display:flex;flex-direction:column;gap:3px}label{color:#94a7c5;font-size:12px}input{width:100%;min-width:0;padding:6px;border:1px solid #293852;border-radius:4px;outline:none;background:#0b1120;color:#edf3ff;font:inherit}input:focus{border-color:#38bdf8}button{padding:6px 9px;border:0;border-radius:4px;cursor:pointer;font:inherit;font-weight:bold}button:disabled{cursor:not-allowed;opacity:.5}.primary-button{background:#38bdf8;color:#062033}.edit-button{background:#243c59;color:#edf3ff}.delete-button{background:#482332;color:#fecdd3}.message{display:none;margin-top:6px;padding:6px;border-radius:4px;font-size:12px}.message.success{display:block;background:#10352e;color:#a7f3d0}.message.error{display:block;background:#451f2b;color:#fecdd3}.table-wrapper{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:6px;border-bottom:1px solid #293852;text-align:right;font-size:12px}th{color:#94a7c5;font-weight:normal}tbody tr:last-child td{border-bottom:0}.actions{display:flex;gap:3px}.actions button{padding:3px 6px;font-size:11px}.empty-state,.loading-state{padding:14px;color:#94a7c5;text-align:center}.footer{color:#94a7c5;text-align:center;font-size:11px}@media(max-width:650px){.summary{gap:6px}.card,.panel{padding:8px}.summary-value{font-size:16px}form{grid-template-columns:1fr}form button{width:100%}}</style></head><body><main class=container><header><h1>إدارة الأشخاص والأرصدة</h1><p>لوحة بسيطة لعرض الأشخاص وإدارة بياناتهم وأرصدتهم.</p></header><section class=summary><article class=card><div class=summary-label>عدد الأشخاص</div><div class=summary-value id=peopleCount>0</div></article><article class=card><div class=summary-label>إجمالي الأرصدة</div><div class="summary-value balance-value" id=totalBalance>0.00</div></article></section><section class=panel><h2 id=formTitle>إضافة شخص جديد</h2><form id=personForm><div class=field><label for=name>اسم الشخص</label><input id=name name=name maxlength=100 placeholder="اكتب اسم الشخص" required></div><div class=field><label for=balance>الرصيد</label><input id=balance name=balance type=number min=0 step=0.01 value=0 required></div><button class=primary-button id=submitButton>إضافة الشخص</button></form><div id=message class=message></div></section><section class=panel><h2>قائمة الأشخاص</h2><div class=table-wrapper><table><thead><tr><th>الرقم</th><th>الاسم</th><th>الرصيد</th><th>الإجراءات</th></tr></thead><tbody id=peopleTable><tr><td colspan=4 class=loading-state>جاري تحميل البيانات...</td></tr></tbody></table></div></section><div class=footer>People Accounts Management System</div></main><script src="app.js"></script></body></html>
