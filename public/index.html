<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إدارة الأشخاص والأرصدة</title><style>:root{color-scheme:dark;--background:#0b1120;--surface:#141d30;--surface-light:#1b2940;--border:#293852;--text:#edf3ff;--muted:#94a7c5;--primary:#38bdf8;--success:#34d399;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 16px;background:var(--background);color:var(--text);font-family:Tahoma,Arial,sans-serif}.container{width:min(100%,1000px);margin:0 auto}header{margin-bottom:28px}header h1{margin:0 0 10px;font-size:clamp(24px,4vw,34px)}header p{margin:0;color:var(--muted);line-height:1.8}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}.card,.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px}.summary-label{color:var(--muted);font-size:14px}.summary-value{margin-top:12px;font-size:28px;font-weight:bold;overflow-wrap:anywhere}.balance-value{color:var(--success)}.panel{margin-bottom:24px}.panel h2{margin:0 0 20px;font-size:20px}form{display:grid;grid-template-columns:2fr 1fr auto;align-items:end;gap:14px}.field{display:flex;flex-direction:column;gap:9px}label{color:var(--muted);font-size:14px}input{width:100%;min-width:0;padding:13px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--background);color:var(--text);font:inherit}input:focus{border-color:var(--primary)}button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer;font:inherit;font-weight:bold;transition:opacity 0.2s}button:hover{opacity:0.85}button:disabled{cursor:not-allowed;opacity:0.5}.primary-button{background:var(--primary);color:#062033}.edit-button{background:#243c59;color:var(--text)}.delete-button{background:#482332;color:#fecdd3}.message{display:none;margin-top:16px;padding:12px;border-radius:10px;line-height:1.7}.message.success{display:block;background:#10352e;color:#a7f3d0}.message.error{display:block;background:#451f2b;color:#fecdd3}.table-wrapper{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:16px 12px;border-bottom:1px solid var(--border);text-align:right}th{color:var(--muted);font-size:13px;font-weight:normal}tbody tr:last-child td{border-bottom:0}.actions{display:flex;gap:8px}.actions button{padding:9px 12px;font-size:13px}.empty-state,.loading-state{padding:30px;color:var(--muted);text-align:center}.footer{color:var(--muted);text-align:center;font-size:12px}@media (max-width:650px){body{padding:22px 12px}.summary{gap:10px}.card,.panel{padding:16px}.summary-value{font-size:22px}form{grid-template-columns:1fr}form button{width:100%}}</style></head><body><main class="container"><header><h1>إدارة الأشخاص والأرصدة</h1><p>لوحة بسيطة لعرض الأشخاص وإدارة بياناتهم وأرصدتهم.</p></header><section class="summary"><article class="card"><div class="summary-label">عدد الأشخاص</div><div class="summary-value" id="peopleCount">0</div></article><article class="card"><div class="summary-label">إجمالي الأرصدة</div><div class="summary-value balance-value" id="totalBalance">0.00</div></article></section><section class="panel"><h2 id="formTitle">إضافة شخص جديد</h2><form id="personForm"><div class="field"><label for="name">اسم الشخص</label><input id="name" name="name" type="text" maxlength="100" placeholder="اكتب اسم الشخص" required></div><div class="field"><label for="balance">الرصيد</label><input id="balance" name="balance" type="number" min="0" step="0.01" value="0" required></div><button class="primary-button" id="submitButton" type="submit">إضافة الشخص</button></form><div id="message" class="message" role="status" aria-live="polite"></div></section><section class="panel"><h2>قائمة الأشخاص</h2><div class="table-wrapper"><table><thead><tr><th>الرقم</th><th>الاسم</th><th>الرصيد</th><th>الإجراءات</th></tr></thead><tbody id="peopleTable"><tr><td colspan="4" class="loading-state">جاري تحميل البيانات...</td></tr></tbody></table></div></section><div class="footer">People Accounts Management System</div></main><script>const API_URL="/people",personForm=document.getElementById("personForm"),nameInput=document.getElementById("name"),balanceInput=document.getElementById("balance"),submitButton=document.getElementById("submitButton"),formTitle=document.getElementById("formTitle"),peopleTable=document.getElementById("peopleTable"),peopleCount=document.getElementById("peopleCount"),totalBalance=document.getElementById("totalBalance"),message=document.getElementById("message");let people=[],editingId=null;function formatBalance(e){return Number(e).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2})}function showMessage(e,t){message.textContent=e,message.className=`message ${t}`}function clearMessage(){message.textContent="",message.className="message"}async function requestApi(e,t={}){const n=await fetch(e,{...t,headers:{"Content-Type":"application/json",...t.headers}}),a=await n.json().catch(()=>null);if(!n.ok)throw new Error(a?.error||"حصل خطأ أثناء تنفيذ الطلب.");return a}function renderPeople(){peopleCount.textContent=people.length;const e=people.reduce((e,t)=>e+Number(t.Balance),0);if(totalBalance.textContent=formatBalance(e),0===people.length)return void(peopleTable.innerHTML='<tr><td colspan="4" class="empty-state">مفيش أشخاص مسجلين لحد دلوقتي.</td></tr>');peopleTable.replaceChildren(),people.forEach(e=>{const t=document.createElement("tr"),n=document.createElement("td");n.textContent=e.Id;const a=document.createElement("td");a.textContent=e.Name;const s=document.createElement("td");s.textContent=formatBalance(e.Balance);const o=document.createElement("td"),c=document.createElement("div");c.className="actions";const l=document.createElement("button");l.type="button",l.className="edit-button",l.textContent="تعديل",l.addEventListener("click",()=>editPerson(e.Id));const i=document.createElement("button");i.type="button",i.className="delete-button",i.textContent="حذف",i.addEventListener("click",()=>deletePerson(e.Id)),c.append(l,i),o.append(c),t.append(n,a,s,o),peopleTable.append(t)})}async function loadPeople(){peopleTable.innerHTML='<tr><td colspan="4" class="loading-state">جاري تحميل البيانات...</td></tr>';try{people=await requestApi(API_URL),renderPeople()}catch(e){peopleTable.innerHTML='<tr><td colspan="4" class="empty-state">تعذر تحميل البيانات. تأكد إن السيرفر شغال.</td></tr>',showMessage(e.message,"error")}}function resetForm(){editingId=null,personForm.reset(),balanceInput.value="0",formTitle.textContent="إضافة شخص جديد",submitButton.textContent="إضافة الشخص"}function editPerson(e){const t=people.find(t=>t.Id===e);t?(editingId=e,nameInput.value=t.Name,balanceInput.value=t.Balance,formTitle.textContent="تعديل بيانات الشخص",submitButton.textContent="حفظ التعديلات",clearMessage(),personForm.scrollIntoView({behavior:"smooth",block:"center"}),nameInput.focus()):showMessage("الشخص المطلوب مش موجود.","error")}async function deletePerson(e){const t=people.find(t=>t.Id===e);if(t&&confirm(`هل أنت متأكد من حذف "${t.Name}"؟`))try{await requestApi(`${API_URL}/${e}`,{method:"DELETE"}),editingId===e&&resetForm(),showMessage("تم حذف الشخص بنجاح.","success"),await loadPeople()}catch(e){showMessage(e.message,"error")}}personForm.addEventListener("submit",async e=>{e.preventDefault(),clearMessage();const t=nameInput.value.trim(),n=Number(balanceInput.value);if(!t)return void showMessage("اكتب اسم الشخص الأول.","error");if(!Number.isFinite(n)||n<0)return void showMessage("اكتب رصيد صحيح أكبر من أو يساوي صفر.","error");const a=null!==editingId,s=a?`${API_URL}/${editingId}`:API_URL,o=a?"PUT":"POST";submitButton.disabled=!0;try{await requestApi(s,{method:o,body:JSON.stringify({name:t,balance:n})}),showMessage(a?"تم تعديل بيانات الشخص بنجاح.":"تمت إضافة الشخص بنجاح.","success"),resetForm(),await loadPeople()}catch(e){showMessage(e.message,"error")}finally{submitButton.disabled=!1}}),loadPeople();</script></body></html>
